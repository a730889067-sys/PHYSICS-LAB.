name: Build Haraka Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build the Arabic animator
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract full application source
        run: |
          mkdir -p "$RUNNER_TEMP/haraka-source"
          tar -xJf Haraka_Animator_Source.tar.xz -C "$RUNNER_TEMP/haraka-source"

      - name: Check editor JavaScript
        run: |
          cd "$RUNNER_TEMP/haraka-source/HarakaAnimator"
          python3 scripts/check_source.py

      - name: Build APK
        run: |
          cd "$RUNNER_TEMP/haraka-source/HarakaAnimator"
          gradle --no-daemon --stacktrace assembleDebug
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/dist/Haraka-Animator.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Haraka-Animator-APK
          path: dist/Haraka-Animator.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload editable source archive
        uses: actions/upload-artifact@v4
        with:
          name: Haraka-Animator-Source
          path: Haraka_Animator_Source.tar.xz
          if-no-files-found: error
          retention-days: 30
